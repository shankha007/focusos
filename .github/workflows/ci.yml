name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the repository. Without this the token gets the
# repository's default permissions, which can include write access — more than
# a compromised dependency running in `npm ci` should be handed.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs rather than tags: a tag can be moved to different
      # code after the fact, a SHA cannot. The comment names the release so a
      # bump is a readable diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing after checkout pushes, so the token need not stay in .git/config.
          persist-credentials: false

      # Matches the engines.node range in package.json, which Vercel also uses,
      # so CI and the deploy build agree.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies only: a dev-tool advisory is worth knowing
      # about, but it never reaches a visitor. Three shipped to production
      # unremarked before this step existed, one of them critical.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # First, because it is the fastest way to fail and the cheapest to fix.
      # Warnings are reported but do not fail the build — see the note on the
      # React Compiler rules in eslint.config.js.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # What a visitor downloads, measured from the build that just ran. Vite's
      # own chunk-size warning was printed on every build for months without
      # anyone acting on it; a warning is not a gate.
      - name: Bundle budget
        run: npm run check:bundle
