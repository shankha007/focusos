name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the engines.node range in package.json, which Vercel also uses,
      # so CI and the deploy build agree.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies only: a dev-tool advisory is worth knowing
      # about, but it never reaches a visitor. Three shipped to production
      # unremarked before this step existed, one of them critical.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # First, because it is the fastest way to fail and the cheapest to fix.
      # Warnings are reported but do not fail the build — see the note on the
      # React Compiler rules in eslint.config.js.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # What a visitor downloads, measured from the build that just ran. Vite's
      # own chunk-size warning was printed on every build for months without
      # anyone acting on it; a warning is not a gate.
      - name: Bundle budget
        run: npm run check:bundle
