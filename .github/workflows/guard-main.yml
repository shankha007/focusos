name: Guard main

# Branch protection is the real fix, but it needs GitHub Pro on a private
# repository. This is the next best thing: it cannot stop a direct push to
# main, only fail loudly straight after one, so the mistake is visible in the
# commit list and in the failure mail rather than being discovered weeks later.
#
# The matching pre-push hook in .githooks refuses the push in the first place —
# on machines where it is installed. Both exist because neither is enough.

on:
  push:
    branches: [main]

concurrency:
  group: guard-main-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  merged-through-a-pull-request:
    name: merged through a pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check this commit came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Every pull request this commit belongs to, merged, and targeting
          # main. A merge commit's own SHA answers for the whole merge, so one
          # match is enough.
          count=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')

          if [ "$count" -gt 0 ]; then
            echo "$SHA arrived through a merged pull request."
            exit 0
          fi

          echo "::error::$SHA was pushed to main without a merged pull request."
          echo "Changes reach main only through a pull request from uat."
          echo "Undo it with: git revert $SHA — or reset main if nothing else has landed since."
          exit 1
