name: Guard protected branches

# The repository's "Protected branches" ruleset is the real guard: it refuses a
# direct push, a force-push and a deletion on main and uat, and requires a pull
# request that passes CI. This workflow checks the part a ruleset cannot
# express — that the pull request came from the right place:
#
#   your branch ──PR──> uat ──PR──> main
#                        ^                |
#                        └── back-merge ──┘
#
# A ruleset can require a pull request into main; it cannot require that the
# pull request came from uat. So this fails loudly after the fact if it did
# not, which is the only moment anyone can act on it.
#
# The matching pre-push hook in .githooks refuses the push before it leaves the
# machine, on clones where it is installed. All three exist because none of
# them covers the others' gaps.

on:
  push:
    branches: [main, uat]

concurrency:
  group: guard-protected-branches-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  arrived-through-the-right-pull-request:
    name: arrived through the right pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check how this commit reached ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Every pull request this commit belongs to, merged, and targeting
          # the branch that was just pushed. A merge commit's own SHA answers
          # for the whole merge, so one match is enough.
          #
          # main accepts one source — uat.
          #
          # uat accepts any branch, main included. A pull request from main into
          # uat is the back-merge that follows a release: every release leaves
          # its merge commit on main alone, so uat reads as "behind" by one per
          # release until that commit is carried back. It moves no code — the
          # trees are identical at that point — and the rule that matters, that
          # work reaches main only through uat, is enforced on the main side
          # above. Refusing it here only made the tidy-up impossible.
          if [ "$BRANCH" = "main" ]; then
            expected='the source branch must be uat'
            filter='[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "uat")] | length'
          else
            expected='it must arrive through a merged pull request'
            filter='[.[] | select(.merged_at != null and .base.ref == "uat")] | length'
          fi

          # Retried, because GitHub does not associate a merge commit with its
          # pull request the instant the merge happens. This job starts within
          # seconds of the push and has already seen an empty list for a commit
          # that a re-run twenty seconds later matched happily — a guard that
          # cries wolf teaches people to ignore it, which is worse than not
          # having one.
          matches=0
          for attempt in 1 2 3 4 5; do
            matches=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq "$filter")
            [ "$matches" -gt 0 ] && break
            echo "No pull request associated with $SHA yet (attempt $attempt); waiting."
            sleep 10
          done

          if [ "$matches" -gt 0 ]; then
            echo "$SHA arrived on $BRANCH through a merged pull request — $expected."
            exit 0
          fi

          echo "::error::$SHA reached $BRANCH outside the branch flow — $expected."
          echo "Changes flow: your branch -> uat -> main, one pull request at each step."
          echo "Undo it with: git revert $SHA — or reset $BRANCH if nothing else has landed since."
          exit 1
