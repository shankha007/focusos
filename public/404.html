<!doctype html>
<!--
  Served by Vercel for any path that is not "/" and not one of the application
  routes listed in vercel.json. Before this existed, the catch-all rewrite
  answered every made-up URL with the landing page and a 200 — a soft 404, which
  tells a crawler the page exists and leaves it indexing duplicates of "/".

  Deliberately standalone: no bundle, no service worker, no theme script. It is
  the page someone gets when nothing else matched, so it has to stand up on its
  own. That also means it cannot read the visitor's theme, so it commits to the
  dark one the app ships with, and the markup carries its own styles — the CSP
  allows inline styles but not inline scripts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · FocusOS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        box-sizing: border-box;
        background: #0b0b0f;
        color: #e9ecf8;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      p.code {
        margin: 0 0 0.75rem;
        font-size: 0.8125rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6f77ff;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.875rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p.body {
        margin: 0 0 2rem;
        color: #949cb8;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.9375rem;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid #23252f;
        color: #e9ecf8;
      }
      a.primary {
        background: #6f77ff;
        border-color: #6f77ff;
        color: #0b0b0f;
      }
      a:focus-visible {
        outline: 2px solid #6f77ff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>That page doesn't exist</h1>
      <p class="body">
        The link may be out of date, or the address mistyped. Your sessions and tasks are safe —
        they live in this browser, not on a server.
      </p>
      <div class="actions">
        <a class="primary" href="/dashboard">Open FocusOS</a>
        <a href="/">Back to the home page</a>
      </div>
    </main>
  </body>
</html>
