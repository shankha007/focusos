<!doctype html>
<html lang="en" data-theme="midnight" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the web manifest entirely and applies its own corner rounding,
         so it needs a flat square of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />

    <script>
      // The user's appearance lives in IndexedDB, which cannot be read before
      // the first paint — and the landing page never opens it at all. The
      // settings store mirrors the resolved theme into localStorage on every
      // paint; this reads it back and stamps the document before anything is
      // drawn, so a light-theme user does not get a dark flash on the way in.
      // Keep the 'system' resolution in step with systemTheme() in
      // src/store/useSettingsStore.ts.
      (function () {
        try {
          var saved = localStorage.getItem("focusos:appearance");
          if (!saved) return;
          var a = JSON.parse(saved);
          var theme = a.theme;
          var mode = a.mode;
          if (a.pref === "system") {
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            theme = dark ? "midnight" : "light";
            mode = dark ? "dark" : "light";
          }
          var root = document.documentElement;
          if (theme) root.dataset.theme = theme;
          if (mode) root.dataset.mode = mode;
          if (a.motion) root.dataset.motion = a.motion;
          if (a.contrast) root.dataset.contrast = a.contrast;
        } catch (e) {
          // A malformed or unreadable value just means the markup's default stands.
        }
      })();
    </script>

    <!-- Under 60 characters, so Google shows it whole, and the keyword leads:
         the brand is what someone reads last, not what they searched for. -->
    <title>Free Offline Pomodoro Timer with Analytics · FocusOS</title>
    <meta
      name="description"
      content="A free Pomodoro timer that works offline and learns the session length you actually finish. Deep focus mode, distraction tracking, analytics. No account."
    />
    <!-- Lets Discover and image results use the full share card rather than a thumbnail. -->
    <meta name="robots" content="max-image-preview:large" />
    <!-- index.html is served for every route, so the canonical points at the one
         page with content. robots.txt keeps crawlers off the app routes. -->
    <link rel="canonical" href="https://focusos.pro/" />

    <!-- Kept word for word in step with <title> and the description above: a
         share card that disagrees with the search result reads as two products. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FocusOS" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://focusos.pro/" />
    <meta property="og:title" content="Free Offline Pomodoro Timer with Analytics · FocusOS" />
    <meta
      property="og:description"
      content="A free Pomodoro timer that works offline and learns the session length you actually finish. Deep focus mode, distraction tracking, analytics. No account."
    />
    <meta property="og:image" content="https://focusos.pro/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FocusOS — not just a timer, the whole focus workflow." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free Offline Pomodoro Timer with Analytics · FocusOS" />
    <meta
      name="twitter:description"
      content="A free Pomodoro timer that works offline and learns the session length you actually finish. Deep focus mode, distraction tracking, analytics. No account."
    />
    <meta name="twitter:image" content="https://focusos.pro/og-image.png" />

    <!--
      A @graph rather than one object, so the site, the application and the
      person who wrote it are separate nodes that reference each other by @id —
      which is how a search engine tells "the author of this app" from "a name
      in a field".

      Deliberately absent: aggregateRating and review. Both are eligible for
      stars in a search result, and both would have to be invented here. The
      landing copy is held to what is true of the shipped app; the markup is
      held to the same standard.

      Not executable, so the CSP script-src hashes in vercel.json do not cover
      this block and do not need updating when it changes.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://focusos.pro/#website",
            "url": "https://focusos.pro/",
            "name": "FocusOS",
            "description": "A free, offline-first Pomodoro timer and focus workspace.",
            "inLanguage": "en",
            "publisher": { "@id": "https://focusos.pro/#author" }
          },
          {
            "@type": "Person",
            "@id": "https://focusos.pro/#author",
            "name": "Shankha Shubhra Das",
            "url": "https://focusos.pro/",
            "sameAs": [
              "https://github.com/shankha007",
              "https://www.linkedin.com/in/shankhad/"
            ]
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://focusos.pro/#app",
            "name": "FocusOS",
            "url": "https://focusos.pro/",
            "applicationCategory": "ProductivityApplication",
            "applicationSubCategory": "Pomodoro timer",
            "operatingSystem": "Any modern web browser",
            "browserRequirements": "Requires JavaScript. Works offline once loaded.",
            "softwareVersion": "1.0.0",
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "description": "An offline-first Pomodoro workspace: plan the day, run deep-focus sessions, log distractions, and get analysis back. Data never leaves the browser.",
            "image": "https://focusos.pro/og-image.png",
            "screenshot": "https://focusos.pro/og-image.png",
            "featureList": [
              "Pomodoro timer with adaptive session and break lengths",
              "Deep Focus Mode with a full-screen countdown and picture-in-picture",
              "Distraction logging and distraction-pattern analysis",
              "Focus analytics by day, week, month and year",
              "A written daily reflection assembled from your own session data",
              "Tasks with priorities, categories and session estimates",
              "Eight ambient soundscapes synthesized in the browser",
              "Works offline and installs as a Progressive Web App"
            ],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "author": { "@id": "https://focusos.pro/#author" },
            "isPartOf": { "@id": "https://focusos.pro/#website" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!--
      Empty on purpose. The marketing pages are rendered into this element at
      build time by scripts/prerender.mjs, so what a crawler downloads is the
      page itself. App routes are served app.html instead, which never carries
      pre-rendered markup for React to throw away.
    -->
    <div id="root"></div>
    <noscript>
      <p style="max-width: 44rem; margin: 0 auto; padding: 0 1.5rem 12vh; font-family: system-ui, sans-serif; color: #949cb8;">
        FocusOS is an offline-first web app and needs JavaScript to run. Enable it and reload to
        start a session.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
